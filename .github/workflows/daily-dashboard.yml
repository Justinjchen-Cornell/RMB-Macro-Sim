name: Daily dashboard refresh

on:
  schedule:
    - cron: "23 2 * * *"      # 02:23 UTC = 10:23 Beijing, daily
  workflow_dispatch: {}       # manual trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet numpy pandas matplotlib pyyaml requests
          pip install --quiet fredapi akshare

      - name: Refresh dashboard with live calibration
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python export_dashboard.py --live

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html index.html dashboard_data.json dashboard_template.html
          git diff --cached --quiet || git commit -m "Auto: daily dashboard refresh [$(date -u +%Y-%m-%d)]"
          git push origin main || echo "nothing to push"
